name: Build Toolbox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"
  WHISPER_CPP: "v1.9.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install yt-dlp + ffmpeg (for the real-download tests)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --user yt-dlp
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get whisper.cpp (on-device speech-to-text)
        run: git clone --depth 1 --branch "$WHISPER_CPP" https://github.com/ggml-org/whisper.cpp android/app/src/main/cpp/whisper.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Signing key (from the ANDROID_KEYSTORE_B64 secret, if set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "Signing with the release key"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set - APK is signed with a temporary debug key, so each new build needs an uninstall first."
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --build-number ${{ github.run_number }}
      - name: Check APK only contains 64-bit ARM libraries
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Toolbox.apk
          unzip -l Toolbox.apk | grep -oE 'lib/[^/]+/' | sort -u
          if unzip -l Toolbox.apk | grep -qE 'lib/(armeabi-v7a|x86|x86_64)/'; then echo "Unexpected ABI in APK"; exit 1; fi
          for so in libflutter.so libpython.so libffmpeg.so libqjs.so libvoicejni.so libtranslate_jni.so; do
            unzip -l Toolbox.apk | grep -q "lib/arm64-v8a/$so" || { echo "Missing $so"; exit 1; }
          done
          ls -la Toolbox.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Toolbox-android
          path: Toolbox.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows app
        run: flutter build windows --release --build-number ${{ github.run_number }}
      - name: Build whisper-cli (speech-to-text)
        shell: pwsh
        run: |
          git clone --depth 1 --branch "$env:WHISPER_CPP" https://github.com/ggml-org/whisper.cpp wcpp
          cmake -S wcpp -B wbuild -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
          cmake --build wbuild --config Release --target whisper-cli -j 4
      - name: Bundle tools (yt-dlp, FFmpeg, Deno, whisper-cli)
        shell: pwsh
        run: |
          $app = "build/windows/x64/runner/Release"
          $tools = "$app/tools"
          New-Item -ItemType Directory -Force $tools | Out-Null
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$tools/yt-dlp.exe"
          Invoke-WebRequest "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
          Get-ChildItem ffmpeg-x -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination $tools
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath $tools
          Get-ChildItem wbuild -Recurse -Filter whisper-cli.exe | Select-Object -First 1 | Copy-Item -Destination $tools
          Get-ChildItem $tools
          if (-not (Test-Path "$tools/whisper-cli.exe")) { throw "whisper-cli.exe missing" }
          Compress-Archive -Path "$app/*" -DestinationPath Toolbox-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Toolbox-windows
          path: Toolbox-windows.zip

  release:
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Toolbox.apk dist/Toolbox-windows.zip \
            --title "Toolbox (latest build)" \
            --notes "Built from ${{ github.sha }}. Android: download Toolbox.apk on your phone. Windows: download Toolbox-windows.zip, extract, run toolbox.exe."
